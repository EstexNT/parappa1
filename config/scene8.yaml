name: Scene 8 Comod
sha1: e5c238222dabb228902d0ad83f9f1dc3ed5c8221
options:
  basename: scene8
  target_path: disc/S8/COMOD8.BIN
  base_path: ../
  platform: psx
  compiler: PSYQ

  asm_path: asm/scene8
  src_path: src/scene8
  build_path: build/

  ld_script_path: linker/scene8.ld

  find_file_boundaries: False
  global_vram_start: 0x80010000

  o_as_suffix: False
  use_legacy_include_asm: False

  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel

  section_order: [".rodata", ".text", ".data", ".bss"]

  symbol_addrs_path:
    - config/symbol_addrs.scene8.txt
    - config/symbol_addrs.prr.bin.txt
  reloc_addrs_path:
    - configs/reloc_addrs.scene8.txt

  undefined_funcs_auto_path: linker/undefined_funcs_auto.scene8.txt
  undefined_syms_auto_path: linker/undefined_syms_auto.scene8.txt

  extensions_path: tools/splat_ext

  subalign: 4

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  ld_bss_is_noload: False
segments:
  - name: scene8
    type: code
    start: 0x0
    vram: 0x801CC21C
    bss_size: 0x20000 # TODO: More proper size here
    align: 4
    subalign: 4
    subsegments:
      - [0x0, rodata, 0] # prsqevs8
      - [0x58, rodata, 58] # prscn8
      
      - [0x78, c, prscn8]
      - [0x6F80, data, prscn8]
      - [0x701C, data, prsqevs8]
      - { vram: 0x801D4944, type: bss }
  - [0x10050]

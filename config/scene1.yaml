name: Scene 1 Comod
sha1: 71d39852dc05aa1037ba6e5eb3c05b11df81e2d6
options:
  basename: scene1
  target_path: disc/S1/COMOD1.BIN
  base_path: ../
  platform: psx
  compiler: PSYQ

  asm_path: asm/scene1
  src_path: src/scene1
  build_path: build/

  ld_script_path: linker/scene1.ld

  find_file_boundaries: False
  global_vram_start: 0x80010000

  o_as_suffix: False
  use_legacy_include_asm: False

  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel

  section_order: [".rodata", ".text", ".data", ".bss"]

  symbol_addrs_path:
    - config/symbol_addrs.scene1.txt
    - config/symbol_addrs.prr.bin.txt
  reloc_addrs_path:
    - configs/reloc_addrs.scene1.txt

  undefined_funcs_auto_path: linker/undefined_funcs_auto.scene1.txt
  undefined_syms_auto_path: linker/undefined_syms_auto.scene1.txt

  extensions_path: tools/splat_ext

  subalign: 4

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  ld_bss_is_noload: False
segments:
  - name: scene1
    type: code
    start: 0x0
    vram: 0x801CC21C
    bss_size: 0x20000 # TODO: More proper size here
    align: 4
    subalign: 4
    subsegments:
      - [0x0, rodata, 0] # prsqevs1
      - [0xB2C, .rodata, prscn1]
      
      - [0xB64, c, prscn1]
      - [0x9B50, .data, prscn1]
      - [0x9B98, data, prsqevs1]
      - { vram: 0x801DF2F8, type: bss }
  - [0x1B3D4]

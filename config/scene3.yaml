name: Scene 3 Comod
sha1: f04719c4b29358f3f22cb66f1de3ec2407eed8cd
options:
  basename: scene3
  target_path: disc/S3/COMOD3.BIN
  base_path: ../
  platform: psx
  compiler: PSYQ

  asm_path: asm/scene3
  src_path: src/scene3
  build_path: build/

  ld_script_path: linker/scene3.ld

  find_file_boundaries: False
  global_vram_start: 0x80010000

  o_as_suffix: False
  use_legacy_include_asm: False

  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel

  section_order: [".rodata", ".text", ".data", ".bss"]

  symbol_addrs_path:
    - config/symbol_addrs.scene3.txt
    - config/symbol_addrs.prr.bin.txt
  reloc_addrs_path:
    - configs/reloc_addrs.scene3.txt

  undefined_funcs_auto_path: linker/undefined_funcs_auto.scene3.txt
  undefined_syms_auto_path: linker/undefined_syms_auto.scene3.txt

  extensions_path: tools/splat_ext

  subalign: 4

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  ld_bss_is_noload: False
segments:
  - name: scene3
    type: code
    start: 0x0
    vram: 0x801CC21C
    bss_size: 0x20000 # TODO: More proper size here
    align: 4
    subalign: 4
    subsegments:
      - [0x0, rodata, 0] # prsqevs3
      - [0x970, rodata, 970] # prscn3
      
      - [0x9A8, c, prscn3]
      - [0xB94C, data, prscn3]
      - [0xB994, data, prsqevs3]
      - { vram: 0x801DFD34, type: bss }
  - [0x1D074]
